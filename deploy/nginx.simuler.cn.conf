# TorchCoder reverse-proxy example for simuler.cn
#
# 1. Point the DNS A/AAAA record for simuler.cn at this server.
# 2. Install nginx and certbot:
#      sudo apt install nginx certbot
# 3. Obtain or renew the certificate before enabling this file:
#      sudo certbot certonly --standalone -d simuler.cn
# 4. Copy or symlink this file into your nginx site config directory, then reload nginx.

server {
    listen 80;
    listen [::]:80;
    server_name simuler.cn;

    return 301 https://simuler.cn$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name simuler.cn;

    ssl_certificate /etc/letsencrypt/live/simuler.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simuler.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
